services:
  iroffer:
    build:
      context: .
      args:
        IROFFER_USER_ID: ${IROFFER_USER_ID:-1000}
        IROFFER_GROUP_ID: ${IROFFER_GROUP_ID:-1000}
    # Pull the CI-built image from GitHub Container Registry:
    #   docker compose pull && docker compose up -d
    # (or keep building locally with `docker compose up -d --build`)
    image: ${IMAGE_NAME:-ghcr.io/jenga201/iroffer-dinoex}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-iroffer}
    restart: unless-stopped
    tty: true        # iroffer requires a pseudo-TTY for foreground (-k) mode
    # ---- Security hardening ----
    # Drop ALL capabilities; re-add only what the root entrypoint needs to
    # initialize the mounted volumes and drop privileges to the iroffer user:
    #   CHOWN/FOWNER - chown/chmod ${CONFIG_DIR}/${DATA_DIR} on first start
    #   SETUID/SETGID - runuser switch to the unprivileged iroffer user
    # The bot itself then runs fully unprivileged (no raw sockets, no ports
    # < 1024). If you set http_port/telnet_port below 1024, additionally
    # cap_add NET_BIND_SERVICE.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env         # all IROFFER_* config-directive variables live here
    volumes:
      - ${CONFIG_DIR}:/home/iroffer
      - ${DATA_DIR}:/data
    ports:
      - ${PORT_RANGE}:${PORT_RANGE}
      # Optional: publish the built-in webserver. Set HTTP_PORT in .env, then
      # uncomment and adjust (example publishes on localhost only):
      # - ${HTTP_PORT_PUBLISH:-127.0.0.1:8080}:${HTTP_PORT:-8080}
