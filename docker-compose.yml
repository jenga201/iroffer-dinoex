services:
  iroffer:
    build:
      context: .
      args:
        IROFFER_USER_ID: ${IROFFER_USER_ID:-1000}
        IROFFER_GROUP_ID: ${IROFFER_GROUP_ID:-1000}
    image: ${IMAGE_NAME:-iroffer-dinoex}:${IMAGE_TAG:-local}
    container_name: ${CONTAINER_NAME:-iroffer}
    restart: unless-stopped
    tty: true        # iroffer requires a pseudo-TTY for foreground (-k) mode
    env_file:
      - .env         # all IROFFER_* config-directive variables live here
    volumes:
      - ${CONFIG_DIR}:/home/iroffer
      - ${DATA_DIR}:/data
    ports:
      - ${PORT_RANGE}:${PORT_RANGE}
      # Optional: publish the built-in webserver. Set HTTP_PORT in .env, then
      # uncomment and adjust (example publishes on localhost only):
      # - ${HTTP_PORT_PUBLISH:-127.0.0.1:8080}:${HTTP_PORT:-8080}
